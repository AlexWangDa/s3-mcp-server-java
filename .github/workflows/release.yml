name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate release version
        id: project
        shell: bash
        run: |
          version="$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "Refusing to release snapshot version: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build and verify
        run: ./mvnw -B clean verify

      - name: Generate checksum
        env:
          VERSION: ${{ steps.project.outputs.version }}
        shell: bash
        run: |
          artifact="s3-mcp-server-${VERSION}.jar"
          test -f "target/${artifact}"
          cd target
          sha256sum "$artifact" > "${artifact}.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.project.outputs.version }}
        shell: bash
        run: |
          artifact="s3-mcp-server-${VERSION}.jar"
          gh release create "$GITHUB_REF_NAME" \
            "target/${artifact}" "target/${artifact}.sha256" \
            --verify-tag \
            --generate-notes \
            --title "v${VERSION}"
